<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>PoolCam Camera Test</title><style>body{font-family:-apple-system,sans-serif;background:#07110c;color:white;margin:0;padding:18px}video{width:100%;background:#000;border-radius:14px;min-height:260px;object-fit:contain}button{font-size:20px;font-weight:800;width:100%;padding:18px;margin:14px 0;border:0;border-radius:14px;background:#22b765;color:white}pre{white-space:pre-wrap;background:#101b14;padding:14px;border-radius:12px}</style></head><body><h1>PoolCam Camera Test</h1><p>This page contains no OpenCV, game rules, recording, or analysis.</p><video id="testVideo" autoplay playsinline muted></video><button id="go">Start Rear Camera</button><pre id="status">Waiting.</pre><script>
(function(){const v=document.getElementById('testVideo'),b=document.getElementById('go'),s=document.getElementById('status');b.onclick=async function(){b.disabled=true;s.textContent='Secure context: '+window.isSecureContext+'\nRequesting camera…';try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('navigator.mediaDevices.getUserMedia unavailable');let st;for(const c of[{video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false},{video:{facingMode:{ideal:'environment'}},audio:false},{video:true,audio:false}]){try{st=await navigator.mediaDevices.getUserMedia(c);break}catch(e){s.textContent+='\nAttempt failed: '+e.name+' '+e.message}}if(!st)throw new Error('All camera attempts failed');v.srcObject=st;await v.play().catch(()=>{});await new Promise(r=>setTimeout(r,700));s.textContent+='\nSUCCESS\nVideo: '+v.videoWidth+'×'+v.videoHeight+'\nTracks: '+st.getVideoTracks().length;}catch(e){s.textContent+='\nFAILED: '+e.name+' '+e.message;b.disabled=false}}})();
</script></body></html>
